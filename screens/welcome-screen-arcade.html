<h1>
    <span id="letter-s1">S</span>
    <span id="letter-t">T</span>
    <span id="letter-i">I</span>
    <span id="letter-c">C</span>
    <span id="letter-k">K</span>
    <span id="letter-y">Y</span>
    <br>
    <span id="letter-h">H</span>
    <span id="letter-a">A</span>
    <span id="letter-n">N</span>
    <span id="letter-d">D</span>

<div class="player-selection">
    <p>Waiting for players to join...</p>
</div>
<div class="player-join-status">
    <div class="player2 join-text-container top-left">
        <p class="join-text">Press <span class="key-code">w</span> to join</p>
        <p class="unjoin-text hidden">Press <span class="key-code">q</span> to un-join</p>
    </div>
    <div class="player3 join-text-container top-right">
        <p class="join-text">Press <span class="key-code">o</span> to join</p>
        <p class="unjoin-text hidden">Press <span class="key-code">p</span> to un-join</p>
    </div>
    <div class="player4 join-text-container bottom-left">
        <p class="join-text">Press <span class="key-code">d</span> to join</p>
        <p class="unjoin-text hidden">Press <span class="key-code">s</span> to un-join</p>
    </div>
    <div class="player1 join-text-container bottom-right">
        <p class="join-text">Press <span class="key-code">k</span> to join</p>
        <p class="unjoin-text hidden">Press <span class="key-code">l</span> to un-join</p>
    </div>
</div>
