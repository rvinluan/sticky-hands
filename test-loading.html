<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Screen Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #B9B9B9;
        }
        
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            background-color: #B9B9B9;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #D9D9D9;
            border-top: 4px solid #C0FF52;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 2rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 2rem;
            color: #C0FF52;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .progress-bar {
            width: 300px;
            height: 8px;
            background-color: #D9D9D9;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        
        .progress-fill {
            height: 100%;
            background-color: #C0FF52;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            font-size: 1rem;
            color: #C0FF52;
            text-align: center;
        }
        
        .hidden {
            display: none !important;
        }
        
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #C0FF52;
            font-size: 3rem;
        }
    </style>
</head>
<body>
    <div id="loading-screen" class="loading-container">
        <div class="loading-spinner"></div>
        <h2 class="loading-text">Loading...</h2>
        <div class="loading-progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text" id="progress-text">0%</div>
        </div>
    </div>
    
    <div id="welcome-screen" class="welcome-screen hidden">
        <h1>Welcome Screen Loaded!</h1>
        <p>Assets have been successfully loaded.</p>
    </div>
    
    <script>
        // Simple asset loader for testing
        class TestAssetLoader {
            constructor() {
                this.totalAssets = 10;
                this.loadedAssets = 0;
                this.progressFill = document.getElementById('progress-fill');
                this.progressText = document.getElementById('progress-text');
            }
            
            async loadAllAssets() {
                console.log('Starting test asset preload...');
                
                // Simulate loading assets
                for (let i = 0; i < this.totalAssets; i++) {
                    await this.simulateAssetLoad();
                    this.updateProgress();
                }
                
                console.log('All test assets loaded successfully');
                this.hideLoadingScreen();
            }
            
            simulateAssetLoad() {
                return new Promise(resolve => {
                    setTimeout(resolve, 200); // Simulate 200ms load time
                });
            }
            
            updateProgress() {
                this.loadedAssets++;
                const percentage = Math.round((this.loadedAssets / this.totalAssets) * 100);
                
                if (this.progressFill) {
                    this.progressFill.style.width = `${percentage}%`;
                }
                
                if (this.progressText) {
                    this.progressText.textContent = `${percentage}%`;
                }
            }
            
            hideLoadingScreen() {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.classList.add('hidden');
                }
                
                const welcomeScreen = document.getElementById('welcome-screen');
                if (welcomeScreen) {
                    welcomeScreen.classList.remove('hidden');
                }
            }
        }
        
        // Start loading when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const assetLoader = new TestAssetLoader();
            assetLoader.loadAllAssets();
        });
    </script>
</body>
</html>
